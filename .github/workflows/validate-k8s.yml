name: Validate Kubernetes manifests

on:
  pull_request:
    paths:
      - "k8s/**"
      - ".github/workflows/**"
  push:
    branches: ["kubernetes-basics"]
    paths:
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Lint k8s YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200, level: warning}}}" k8s

  kubeconform:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          set -euo pipefail
          VERSION="v0.7.0"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate manifests against Kubernetes schemas
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "1.29.0" \
            k8s/*.yaml

  kubectl-dry-run:
    name: kubectl dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"
      - name: Client-side validate
        run: |
          set -euo pipefail
          # В GitHub Actions нет kube-apiserver, поэтому kubectl не может скачать OpenAPI схему
          # для встроенной валидации. Схемы мы валидируем отдельным шагом kubeconform.
          kubectl apply --dry-run=client --validate=false -f k8s >/dev/null
